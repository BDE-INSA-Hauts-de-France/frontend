server {
    listen 80;
    root /usr/share/nginx/html;   # where the Dockerfile COPYs build/ into
    index index.html;
    absolute_redirect off;        # emit /dir -> /dir/ as a relative path; can't leak http:// or an internal port
    error_page 404 /404.html;     # Docusaurus emits build/404.html; return a real 404 status
    # No try_files catch-all: Docusaurus prerenders one HTML file per route,
    # so unknown paths must 404 natively instead of serving the app shell (soft-404).

    # Clean URLs for PDFs handed out as-is (QR codes, Instagram bio, posters):
    # /<name> serves static/files/<name>.pdf in place, without changing the visible URL.
    # Names are an explicit allowlist -- an open regex would shadow top-level Docusaurus routes.
    #   - default_type: the URL has no extension, so nginx cannot infer the type. Without this
    #     line it falls back to application/octet-stream, which downloads instead of opening
    #     the browser's built-in PDF viewer.
    #   - Content-Disposition inline: already the default behaviour, but the filename gives a
    #     correct .pdf name if the reader hits "Save" from inside the viewer.
    # To publish another document, add its name to the alternation below.
    location ~ ^/(livret-assos-2026)/?$ {
        default_type application/pdf;
        add_header Content-Disposition "inline; filename=\"$1.pdf\"" always;
        try_files /files/$1.pdf =404;
    }
}
